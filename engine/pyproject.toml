[project]
name = "reigns-engine"
version = "1.0.0"
requires-python = ">=3.11"
# PRD §14 rule 3: fixed stack. All deps are declared here up front so nobody
# has to edit this file mid-hackathon (a classic merge-conflict hotspot).
# Need a new dep? Ask Role B via docs/requests.md.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "motor>=3.4",
    "elevenlabs>=1.0",
    "anthropic>=0.40",
    "numpy>=1.26",
    "matplotlib>=3.8",
    # FR-C7: libraries the Code API Checker inspects must be installed in the engine venv.
    "requests",
    "pandas",
    "flask",
    "openai",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4", "ruff", "black"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
